name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build

  backend:
    name: Backend · import & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all backend + ingestion modules
        run: python -m compileall backend ingestion
      - name: Install lint tooling
        run: pip install ruff==0.8.4
      - name: Ruff (lint, advisory)
        # Advisory for now so a style nit never blocks a merge; a strict
        # ruff config is introduced separately. Surfaces issues without failing CI.
        run: ruff check backend ingestion
        continue-on-error: true
