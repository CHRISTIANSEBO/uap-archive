<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>
      .paper{fill:#0f0e0c}.box{fill:#1a1815;stroke:#35322d;stroke-width:2}.accent{fill:#1a1815;stroke:#e9975e;stroke-width:2}.title{fill:#f2efea;font-size:18px;font-weight:700}.sub{fill:#a8a29a;font-size:14px}.lbl{fill:#77716a;font-size:13px;letter-spacing:.08em;font-family:"JetBrains Mono",monospace}.flow{stroke:#4a4640;stroke-width:2;fill:none;marker-end:url(#gray)}.arrow{stroke:#e9975e;stroke-width:2.4;fill:none;marker-end:url(#orange)}
    </style>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4a4640"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e9975e"/></marker>
  </defs>

  <rect class="paper" width="1400" height="820"/>
  <text x="42" y="48" class="title" font-size="26">UAP Archive — System Architecture</text>
  <text x="42" y="75" class="lbl">PROJECT BLUE BOOK · SEARCHABLE PUBLIC RECORDS · SOURCE-GROUNDED SUMMARIES</text>

  <text x="42" y="120" class="lbl">OFFLINE INGESTION · STANDALONE PYTHON · RESUMABLE · COST-GUARDED</text>

  <rect class="box" x="42" y="138" width="250" height="92" rx="14"/>
  <text x="60" y="170" class="title">1 · Seed + Fetch</text>
  <text x="60" y="194" class="sub">Internet Archive metadata</text>
  <text x="60" y="214" class="sub">PDFs + source.json → /data/raw</text>

  <rect class="box" x="322" y="138" width="230" height="92" rx="14"/>
  <text x="340" y="170" class="title">2 · OCR</text>
  <text x="340" y="194" class="sub">pdftoppm + Tesseract</text>
  <text x="340" y="214" class="sub">per-page text · &lt;60% review</text>

  <rect class="box" x="582" y="138" width="260" height="92" rx="14"/>
  <text x="600" y="170" class="title">3 · Extract</text>
  <text x="600" y="194" class="sub">Claude Haiku → Pydantic JSON</text>
  <text x="600" y="214" class="sub">summaries · fields · geocoding</text>

  <rect class="box" x="872" y="138" width="260" height="92" rx="14"/>
  <text x="890" y="170" class="title">4 · Chunk + Embed</text>
  <text x="890" y="194" class="sub">bge-small-en-v1.5 · local</text>
  <text x="890" y="214" class="sub">384d vectors · exact page refs</text>

  <rect class="accent" x="1162" y="138" width="196" height="92" rx="14"/>
  <text x="1180" y="170" class="title">Pipeline controls</text>
  <text x="1180" y="194" class="sub">status · every stage</text>
  <text x="1180" y="214" class="sub">cost · extract only · $25</text>

  <path class="flow" d="M292 184H320"/><path class="flow" d="M552 184H580"/><path class="flow" d="M842 184H870"/>
  <path class="flow" d="M1132 184H1160"/>
  <path class="flow" d="M712 230V260H1260V232"/>

  <rect class="accent" x="322" y="278" width="760" height="112" rx="16"/>
  <text x="346" y="312" class="title">Postgres + pgvector · single source of truth</text>
  <text x="346" y="340" class="sub">cases · pages · chunks[vector(384)] · pipeline_status · cost_log</text>
  <text x="346" y="364" class="sub">Structured metadata, OCR text, citations, coordinates, summaries, and vectors</text>
  <path class="arrow" d="M712 232V276"/>

  <line x1="42" y1="428" x2="1358" y2="428" stroke="#35322d" stroke-width="1.5"/>
  <text x="42" y="466" class="lbl">LIVE REQUEST PATH · ZERO LLM CALLS AT REQUEST TIME</text>

  <rect class="box" x="42" y="488" width="250" height="118" rx="14"/>
  <text x="62" y="522" class="title">Web browser</text>
  <text x="62" y="548" class="sub">Search · browse · filters</text>
  <text x="62" y="570" class="sub">Map · case details · scans</text>
  <text x="62" y="590" class="sub">Responsive research interface</text>

  <rect class="box" x="332" y="488" width="280" height="118" rx="14"/>
  <text x="352" y="522" class="title">React 18 + TypeScript</text>
  <text x="352" y="548" class="sub">Vite · React Router</text>
  <text x="352" y="570" class="sub">MapLibre GL · case cards</text>
  <text x="352" y="590" class="sub">Built SPA served by FastAPI</text>

  <rect class="box" x="652" y="488" width="400" height="118" rx="14"/>
  <text x="672" y="522" class="title">FastAPI · Gunicorn/Uvicorn</text>
  <text x="672" y="548" class="sub">/api/search · /api/case/{id} · /api/random</text>
  <text x="672" y="570" class="sub">/api/filters · /api/map-points · /api/stats · /api/healthz</text>
  <text x="672" y="590" class="sub">Local query embed → cosine vector search</text>

  <rect class="accent" x="1092" y="488" width="266" height="118" rx="14"/>
  <text x="1112" y="522" class="title">Postgres + pgvector</text>
  <text x="1112" y="548" class="sub">Filters + metadata</text>
  <text x="1112" y="570" class="sub">Ranked semantic matches</text>
  <text x="1112" y="590" class="sub">Page-level citations</text>

  <path class="arrow" d="M292 547H330"/><path class="arrow" d="M612 547H650"/><path class="arrow" d="M1052 547H1090"/>

  <text x="42" y="658" class="lbl">DEPLOYMENT</text>
  <rect class="box" x="42" y="678" width="1316" height="100" rx="16"/>
  <text x="66" y="712" class="title">Docker → Railway</text>
  <text x="66" y="740" class="sub">Multi-stage image: Node builds the Vite SPA · Python 3.11 runs FastAPI · Tesseract + Poppler support ingestion</text>
  <text x="66" y="764" class="sub">One web container serves /api, /assets, /media, and SPA routes · Railway health check /api/healthz · managed Postgres</text>
</svg>
